services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_password
      POSTGRES_DB: game_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - game-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - game-network

  api-gateway:
    build: 
      context: ./api-gateway
      dockerfile: ../Dockerfile.node
    ports:
      - "3000:3000"
    networks:
      - game-network
    depends_on:
      - user-service
      - game-service
      - analytics-service

  user-service:
    build: 
      context: ./user-service
      dockerfile: ../Dockerfile.node
    environment:
      - PORT=3001
      - DB_HOST=postgres
    networks:
      - game-network
    depends_on:
      - postgres

  game-service:
    build: 
      context: ./game-service
      dockerfile: ../Dockerfile.node
    environment:
      - PORT=3002
      - DB_HOST=postgres
    networks:
      - game-network
    depends_on:
      - postgres

  engine-service:
    build: 
      context: ./engine-service
      dockerfile: ../Dockerfile.node
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - REDIS_URL=redis://redis:6379
    networks:
      - game-network
    depends_on:
      - redis

  analytics-service:
    build: 
      context: ./analytics-service
      dockerfile: ../Dockerfile.node
    environment:
      - PORT=3004
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379
    networks:
      - game-network
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

networks:
  game-network:
    driver: bridge
